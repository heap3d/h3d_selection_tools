      <list type="Control" val="cmd @{h3d_selection_tools/scripts/select_most_vertices_poly.py}">
        <atom type="Label">Select Most Vertices Polygon</atom>
        <atom type="Tooltip">Select the polygon with biggest vertex count.</atom>
      </list>

      <list type="Control" val="cmd @{h3d_selection_tools/scripts/select_largest_poly.py}">
        <atom type="Label">Select Largest Polygon</atom>
        <atom type="Tooltip">Select the largest polygon of the mesh.</atom>
      </list>

      <list type="Control" val="cmd @{h3d_selection_tools/scripts/select_polygons_by_largest_flat_area.py}">
        <atom type="Label">Select Largest Area Flat Polygons</atom>
        <atom type="Tooltip">Select the polygons with largest flat area.</atom>
      </list>

      <list type="Control" val="cmd @{h3d_selection_tools/scripts/select_polygons_by_middle_flat_area.py}">
        <atom type="Label">Select Middle Area Flat Polygons</atom>
        <atom type="Tooltip">Select the polygons with middle flat area, closest to the bounding box center.</atom>
      </list>

      <list type="Control" val="cmd @{h3d_selection_tools/scripts/select_polygons_by_2nd_largest_flat_area.py}">
        <atom type="Label">Select 2nd Largest Area Flat Polygons</atom>
